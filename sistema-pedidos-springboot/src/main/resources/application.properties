spring.application.name=sistema-pedidos-springboot


# SERVIDOR

server.port=8081
server.servlet.context-path=/sistema-pedidos


# SPRING MVC / JSP

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# CONFIGURACION DE DATA SOURCE (SQL SERVER)

spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=InventarioDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver


# CONFIGURACION DE JPA / HIBERNATE

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# INVENTARIO SERVICE

inventario.api.base-url=http://localhost:8082/inventario-service/api/inventario
inventario.api.connect-timeout-ms=2000
inventario.api.read-timeout-ms=3000

