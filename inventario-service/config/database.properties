# Puerto donde corre Spring Boot
server.port=8081

# Ruta base con la que responderá tu aplicación (puedes ajustarla si prefieres que sea /sistema-pedidos)
server.servlet.context-path=/sistema-pedidos

# Conexión a la base de datos de Pedidos (si usa SQL Server o H2 local)
# Asegúrate de que las credenciales de SQL Server o H2 coincidan con lo que pide tu proyecto
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=PedidosDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sa

# URL hacia el servicio de inventario que corre en WildFly (puerto 8082)
inventario.api.base-url=http://localhost:8082/inventario-service/api/inventario